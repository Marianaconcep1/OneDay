html { zoom: var(--zoom); }
body::after { content: ""; position: fixed; inset: calc(-2 * var(--bg-blur)); z-index: -1; pointer-events: none; filter: blur(var(--bg-blur));
  background: linear-gradient(color-mix(in srgb, var(--bg) calc(var(--dim) * 100%), transparent), color-mix(in srgb, var(--bg) calc(var(--dim) * 100%), transparent)), var(--wash), var(--bg-img, var(--img-monet)) center / cover no-repeat; }
body {
  font-family: var(--f-body); font-size: 16px; line-height: 1.45; margin: 0;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; overflow-x: clip;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
a { color: var(--slate); }
:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; border-radius: 6px; }

.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px));
}
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px));
  padding-block: 14px 10px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
}
.eyebrow { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.date-h { font-family: var(--f-display); font-weight: 500; font-size: 30px; line-height: 1.1; letter-spacing: -.01em; }
.view-h { font-family: var(--f-display); font-weight: 500; font-size: 28px; line-height: 1.15; }
.h2 { font-family: var(--f-display); font-weight: 500; font-size: 21px; line-height: 1.2; }
.h3 { font-size: 16px; font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.tiny { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-s { display: flex; flex-direction: column; gap: 8px; }
.stack-l { display: flex; flex-direction: column; gap: 20px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row-between { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.row-between > * { min-width: 0; }
.grow { flex: 1; min-width: 0; }
.mt { margin-top: 16px; }
.mt-s { margin-top: 8px; }

.card, .area, details.sect, .wday, .banner, .budget { -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; }
.card.tint { background: var(--slate-soft); border-color: transparent; box-shadow: none; }
.card.pinkt { background: var(--pink-soft); border-color: transparent; box-shadow: none; }

.featured { background: var(--slate); color: var(--slate-ink); border: none; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.featured .eyebrow { color: inherit; opacity: .8; }
.featured .ft-title { font-family: var(--f-display); font-size: 23px; line-height: 1.2; font-weight: 500; }
.featured .ft-meta { font-size: 14px; opacity: .88; }
.featured .btn { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.3); color: inherit; }
.featured .btn.primary { background: var(--slate-ink); color: var(--slate); border-color: transparent; }

.btn {
  min-height: var(--tap); padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; font-weight: 700; font-size: 15px; display: inline-flex;
  align-items: center; justify-content: center; gap: 6px; text-align: center; line-height: 1.2;
  transition: transform .12s ease, background-color .15s ease;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--slate); color: var(--slate-ink); border-color: var(--slate); }
.btn.accent { background: var(--pink-soft); color: var(--pink-ink); border-color: transparent; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--slate); padding-inline: 8px; }
.btn.danger { color: var(--pink-ink); }
.btn.block { width: 100%; }
.btn.sm { min-height: 40px; padding: 8px 12px; font-size: 14px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row > .btn { flex: 1 1 auto; }

.checkin-btn {
  width: 100%; min-height: 60px; border-radius: 16px; border: 2px solid var(--pink); background: var(--pink-soft);
  color: var(--pink-ink); font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: space-between;
  padding: 12px 18px; cursor: pointer; text-align: left; gap: 12px;
}
.checkin-btn .sub { font-weight: 400; font-size: 14px; display: block; }

.area-list { display: flex; flex-direction: column; gap: 10px; }
.area {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px;
  display: grid; grid-template-columns: 10px 1fr; gap: 0 12px;
}
.dot { background: var(--line); }
.area .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; }
.dot.money { background: #6E8B74; }
.dot.business { background: var(--slate); }
.dot.training { background: #B07A4E; }
.dot.art { background: var(--pink); }
.dot.mind { background: #8A80A8; }
.area-body { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.area-name { font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.area-title { font-weight: 700; overflow-wrap: anywhere; }
.area-actions { display: flex; gap: 6px; flex-wrap: wrap; }

.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 700; background: var(--surface-2); color: var(--muted); max-width: 100%; }
.row-between > .pill { flex: none; max-width: 50%; text-align: right; }
.pill.done { background: var(--ok-soft); color: var(--ok); }
.pill.modified { background: var(--mod-soft); color: var(--mod); }
.pill.skipped { background: var(--skip-soft); color: var(--skip); }
.pill.started { background: var(--slate-soft); color: var(--slate); }
.pill.rest { background: var(--ok-soft); color: var(--ok); }
.pill.pink { background: var(--pink-soft); color: var(--pink-ink); }

.banner { border-radius: var(--r); padding: 14px 16px; background: var(--slate-soft); display: flex; flex-direction: column; gap: 10px; }
.banner.pink { background: var(--pink-soft); }
.banner.warn { background: var(--mod-soft); }
.banner .h3 { color: var(--ink); }

.budget { display: flex; flex-direction: column; gap: 6px; background: var(--glass); border-radius: var(--r); padding: 12px 14px; }
.meter { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--slate); border-radius: 99px; }
.meter.over > span { background: var(--mod); }

/* Tabs */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--glass); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tab { background: none; border: 0; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--slate); }

/* Forms */
label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 14px; }
label.f .hint, .hint { font-weight: 400; color: var(--muted); font-size: 13px; }
.inp, select.inp, textarea.inp {
  width: 100%; min-height: var(--tap); border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
  padding: 10px 12px; font-size: 16px; font-weight: 400;
}
textarea.inp { min-height: 76px; resize: vertical; }
.inp:focus { border-color: var(--slate); outline: none; box-shadow: 0 0 0 3px var(--slate-soft); }
.inp.invalid { border-color: var(--pink-ink); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; }
.grid2 > * { min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  max-width: 100%; overflow-wrap: anywhere; text-align: center;
  min-height: 42px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  cursor: pointer; font-size: 15px; font-weight: 700; color: var(--ink);
}
.chip[aria-pressed="true"] { background: var(--slate); border-color: var(--slate); color: var(--slate-ink); }
.chip.pinkc[aria-pressed="true"] { background: var(--pink); border-color: var(--pink); color: #2b1a1f; }
.scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.scale .chip { padding: 8px 0; border-radius: 12px; }
.scale-labels { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.daypick { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.daypick .chip { padding: 8px 0; border-radius: 10px; font-size: 14px; min-height: 44px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg .chip { border: 0; background: transparent; border-radius: 9px; min-height: 40px; padding: 6px 4px; font-size: 14px; }
.seg .chip[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

details.more { border-top: 1px solid var(--line); padding-top: 10px; }
details.more > summary { cursor: pointer; font-weight: 700; color: var(--slate); min-height: 40px; display: flex; align-items: center; list-style: none; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: "+"; margin-left: auto; font-size: 20px; font-weight: 400; }
details.more[open] > summary::after { content: "–"; }
details.sect { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
details.sect > summary { cursor: pointer; list-style: none; padding: 14px 16px; display: flex; gap: 10px; align-items: center; min-height: 56px; }
details.sect > summary::-webkit-details-marker { display: none; }
details.sect > summary::after { content: "›"; margin-left: auto; font-size: 22px; color: var(--muted); transition: transform .2s ease; }
details.sect[open] > summary::after { transform: rotate(90deg); }
details.sect > .sect-body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }

.list { display: flex; flex-direction: column; }
.li { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
.li > .grow { overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: baseline; }
.kv > :nth-child(odd) { color: var(--muted); }
.kv > :nth-child(even) { font-variant-numeric: tabular-nums; text-align: right; font-weight: 700; }

function weekStats(ws, datesOverride) {

    train: { scheduled: 0, completed: 0, modified: 0, skipped: 0, rest: 0, restPlanned: 0, norecord: 0, distPlanned: 0, distActual: 0, distMissing: 0, unplanned: 0 },

A.makeSmaller = () => {
  const td = today();
  const items = itemsFor(td).filter((i) => (i.kind === 'task' || i.kind === 'biz') && !isClosed(i.status) && i.minTitle);

/* Time-budget adjustments: suggested, then accepted or rejected one by one */
function adjustOptions(ds) {
  const dm = dayMinutes(ds);
  const opts = [];
  const sess = sessionFor(ds);
  for (const it of dm.items) {
    if (isClosed(it.status) || it.unplanned) continue;
    if ((it.kind === 'task' || it.kind === 'biz') && !it.smaller && it.minTitle && it.fullMinutes) {
      const saves = it.fullMinutes - (it.kind === 'biz' ? 5 : (it.minMinutes || 1));
      if (saves > 0) opts.push({ id: 'small:' + it.key, label: `Use the smaller version of “${it.plannedTitle}”`, detail: `${it.minTitle} · saves ${minsLabel(saves)}`, apply: () => markSmaller(ds, it.key, 'time budget') });
    }
    if (it.kind === 'task' || it.kind === 'biz') {
      const target = findRoomyDay(ds, it.minutes || 0);
      if (target) opts.push({ id: 'move:' + it.key, label: `Move “${it.plannedTitle || it.title}” to ${dShort(target)}`, detail: `${dShort(target)} has room for it`, apply: () => moveItem(it, ds, target) });
    }
  }
  if (sess && sess.type === 'long') opts.unshift({ id: 'longday', label: 'Long-run day: use the 5-minute business version', detail: 'Keeps business visible without competing with the run', apply: () => markSmaller(ds, 'biz@' + ds, 'long-run day') });
  if (sess && sess.type !== 'rest') opts.push({ id: 'trainreview', label: 'Review today’s training session', detail: 'Opens your plan. The app does not change training for you.', review: true });
  return opts;
}
function findRoomyDay(ds, minutes) {
  for (let i = 1; i <= 6; i++) {
    const d = dAdd(ds, i); const dm = dayMinutes(d);
    if (dm.avail != null && dm.total + minutes <= dm.avail) return d;
  }
  return null;
}
function moveItem(it, from, to) {
  if (it.kind === 'biz') {
    S.exceptions.push({ id: uid('ex'), refId: 'bizblock', date: from, kind: 'off', createdAt: nowISO() });
    if (it.actionId) S.business.nextFor[to] = it.actionId;
  } else {
    S.exceptions.push({ id: uid('ex'), refId: it.taskId, date: from, kind: 'off', createdAt: nowISO() });
    S.exceptions.push({ id: uid('ex'), refId: it.taskId, date: to, kind: 'on', createdAt: nowISO() });
  }
  logChange({ date: from, key: it.key, refId: it.kind === 'biz' ? (it.actionId || 'bizblock') : it.taskId, title: it.plannedTitle || it.title, kind: 'rescheduled', from: dMD(from), to: dMD(to) });
}

};

function taskForKey(key) { if (key.startsWith('t:')) return S.tasks.find((x) => x.id === key.slice(2).split('@')[0]); return null; }

};

  return 'Logged as skipped. The plan is still here tomorrow.';
}

function createOneOff(area, title, finish, minutes, date) {

  S.tasks.push(task); save(); return task;
}

A.progWeek = (el) => { PROG_WEEK = Math.min(0, PROG_WEEK + Number(el.dataset.d)); render(); };
function trainingChart(st, unit) {
  const W = 320, H = 130, pad = 24, bw = 28;
  const rows = st.dates.map((d) => { const s = sessionFor(d); const lg = S.training.logs['tr@' + d]; return { d, s, lg, plan: s && s.distance ? Number(s.distance) : 0, act: lg && lg.distance ? Number(lg.distance) : 0 }; });
  const max = Math.max(1, ...rows.map((r) => Math.max(r.plan, r.act)));
  const nice = max <= 5 ? Math.ceil(max) : Math.ceil(max / 5) * 5;
  const y = (v) => H - pad - (v / nice) * (H - pad - 12);
  const step = (W - 30) / 7;
  let g = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Planned versus logged distance by day">`;
  g += `<line class="grid" x1="26" x2="${W}" y1="${y(0)}" y2="${y(0)}"/><line class="grid" x1="26" x2="${W}" y1="${y(nice)}" y2="${y(nice)}"/>`;
  g += `<text x="0" y="${y(nice) + 4}">${nice}</text><text x="0" y="${y(0) + 4}">0</text>`;
  rows.forEach((r, i) => {
    const x = 30 + i * step + (step - bw) / 2;
    if (r.plan) g += `<rect class="plan" x="${x}" y="${y(r.plan)}" width="${bw}" height="${y(0) - y(r.plan)}" rx="3"/>`;
    if (r.act) g += `<rect class="act" x="${x + 5}" y="${y(r.act)}" width="${bw - 10}" height="${y(0) - y(r.act)}" rx="2"/>`;
    const label = r.s ? (r.s.type === 'rest' ? (r.lg && r.lg.status === 'rest' ? 'Rest ✓' : 'Rest') : (SESSION_TYPES[r.s.type] || '').split(' ')[0]) : '';
    g += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${DOW_LETTER[dDow(r.d)]}</text>`;
    if (label && !r.plan && !r.act) g += `<text x="${x + bw / 2}" y="${y(0) - 6}" text-anchor="middle">${esc(label)}</text>`;
  });
  g += '</svg>';
  return g + `<p class="tiny muted">Outlined: planned distance (${unit}). Filled: logged distance. Rest days are listed separately above, not as distance.</p>`;
}

/* ---------- Weekly report (plain text to paste into ChatGPT) ---------- */
function weeklyReport(ws, withMoney) {
  const st = weekStats(ws); const we = dAdd(ws, 6); const rv = S.reviews[ws];
  const unit = S.training.profile.unit || 'mi';
  const L = [];
  L.push(`One Day weekly report · ${ws} to ${we}`);
  L.push(`(Personal accountability log. Descriptive counts only; please don't infer causes from them.)`);
  L.push('');
  L.push(`Overall: completed as planned ${st.all.done} of ${st.all.scheduled} scheduled; modified ${st.all.modified}; skipped ${st.all.skipped}; no record ${st.all.norecord}.`);
  const mf = movedForward(ws); if (mf.length) { L.push('What moved forward (logged facts):'); mf.forEach((x) => L.push('- ' + x)); }
  const ex = S.experiments.find((x) => x.ws === ws); if (ex) L.push(`This week's experiment: because I noticed ${ex.noticed}, I changed ${ex.change}. Result: ${ex.result || 'not reviewed yet'}.`);
  L.push(`Money: spending log complete ${st.spend.complete + st.spend.none}/${st.spend.days} days (incomplete ${st.spend.incomplete}, not recorded ${st.spend.missing}).` + (withMoney ? ` Expenses recorded: ${money(st.spend.totalCents)} (partial if days are missing).` : ''));
  if (withMoney) { const sv = confirmedSavings(we < today() ? we : today()); L.push(`Confirmed savings: ${sv.value == null ? 'not confirmed' : money(sv.value)}. Buffer goal: ${S.money.buffer.amount == null ? 'not set' : money(S.money.buffer.amount)}.`); }
  L.push(`Business: ${st.biz.done} of ${st.biz.scheduled} sessions as planned, ${st.biz.modified} five-minute versions, ${st.biz.outputs} outputs noted. Stage: ${S.business.stage || 'not set'}. Four-week outcome: ${S.business.outcome4w || 'not set'}. This week's outcome: ${S.business.weekly[ws] || 'not set'}.`);
  const res = S.business.results.filter((r) => r.date >= ws && r.date <= we);
  if (res.length) L.push(`Business results: ${res.map((r) => r.type + (withMoney && r.amount != null ? ' ' + money(r.amount) : '') + (r.note ? ' (' + r.note + ')' : '')).join('; ')}.`);
  L.push(`Training: ${st.train.completed} completed as planned, ${st.train.modified} modified, ${st.train.skipped} skipped, ${st.train.rest}/${st.train.restPlanned} rest days followed, of ${st.train.scheduled} scheduled. Distance logged ${Math.round(st.train.distActual * 100) / 100} ${unit} vs ${Math.round(st.train.distPlanned * 100) / 100} planned.`);
  L.push(`Art: ${st.art.participated} of ${st.art.scheduled} scheduled days${st.art.extra ? ', plus ' + st.art.extra + ' unscheduled' : ''}.`);
  L.push(`Check-ins: ${st.checkins} of ${st.days} days. Mood (1-5, "-" = not recorded): ${st.mood.filter((m) => m !== undefined).map((m) => (m == null ? '-' : m)).join(' ')}. Energy: ${st.energy.filter((m) => m !== undefined).map((m) => (m == null ? '-' : m)).join(' ')}.`);
  const reasons = Object.entries(st.reasons);
  if (reasons.length) L.push(`Reasons noted for skipped/modified items: ${reasons.map(([r, n]) => reasonLabel(r) + ' x' + n).join(', ')}.`);
  if (rv) {
    L.push(''); L.push('Weekly review answers:');
    const q = [['moved', 'What moved forward'], ['blocked', 'What got in the way'], ['adjust', 'Smaller/clearer/better scheduled'], ['money', 'Coming financial obligations'], ['art', 'Time for art and enjoyment']];
    for (const [k, l] of q) if (rv[k]) L.push(`- ${l}: ${rv[k]}`);
    if (rv.adjustmentLabel) L.push(`- Chosen adjustment for next week: ${rv.adjustmentLabel}`);
  }
  L.push(''); L.push('Question for you: based only on this, what is one small, specific change to next week that keeps the plan realistic?');
  // The report is plain text, so each line is translated here rather than on the page
  return L.map((x) => (x.startsWith('- ') ? '- ' + trText(x.slice(2)) : trText(x))).join('\n');
}

    if (id === 'bizblock') {

      const p = taskPlan(task, nextWs);
      out.push({ id: 'small:' + id, label: `Make “${p.title}” smaller`, why: `Skipped ${skips[id]} times on scheduled days in the last four weeks.`, input: { title: p.minTitle || p.title, minutes: p.minMinutes || Math.max(1, Math.round(p.minutes / 2)) }, apply: (inp) => pushVersion(task, Object.assign({}, p, { title: inp.title || p.title, minutes: inp.minutes || p.minutes }), nextWs) });
    }
  }

  if ((st.reasons.forgot || 0) >= 2) out.push({ id: 'cue', label: 'Attach a cue to the spending log', why: `“Forgot” came up ${st.reasons.forgot} times.`, cue: true, apply: (inp) => { S.money.cue = inp.cue || ''; } });
  else if (st.spend.missing >= 3) out.push({ id: 'cue', label: 'Attach the spending log to a daily cue', why: `${st.spend.missing} days had no spending record.`, cue: true, apply: (inp) => { S.money.cue = inp.cue || ''; } });
  const over = st.dates.filter((d) => d <= today() && dayMinutes(d).over);

    if (b && b.days.includes(dow)) out.push({ id: 'bizday', label: `Remove ${DOW_SHORT[dow]} from the business block`, why: `${plural(over.length, 'day')} had more planned than available time.`, apply: () => pushVersion(S.business.block, { days: b.days.filter((d) => d !== dow), minutes: b.minutes }, nextWs) });
  }

}

    <p class="small">${downloaded ? 'The file should be in your Downloads (on iPhone: Files › Downloads). If not, copy the text below and save it in Notes or Files.' : 'If no download started, copy the text below and save it somewhere safe, such as a note or a file in iCloud Drive.'}</p>

}

/* ---------- Boot ---------- */
function onClick(e) {
  const el = e.target.closest('[data-act]');
  if (!el || !el.dataset.act) return;
  const fn = A[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'BUTTON' || el.tagName === 'A') e.preventDefault();
  if (el.tagName === 'INPUT' && el.type === 'checkbox') { fn(el, e); return; }
  if (el.disabled) return;
  // Guard against accidental double taps creating duplicate records
  const now = Date.now();
  if (!NO_GUARD.has(el.dataset.act) && el._last && now - el._last < 400) return;
  el._last = now;
  fn(el, e);
}
const NO_GUARD = new Set(['pick', 'ciStep', 'tab', 'planWeek', 'progWeek', 'progRange', 'progMonth', 'chartTip', 'pinShow', 'obNext', 'obBack', 'closeSheet']);
let lastDay = null;
async function boot() {
  await Store.open();
  await loadAuth(); await loadBgImage();
  let st = null;
  try { st = await Store.get(REAL_KEY); } catch (e) { st = null; }
  if (st && validateState(st).length) { await Store.set('state-unreadable-' + Date.now(), st); st = null; }
  S = st ? normalize(st) : defaultState();
  const td = today();
  RETURN_GAP = S.settings.onboarded && S.settings.lastOpened ? dDiff(S.settings.lastOpened, td) : 0;
  if (S.settings.onboarded) S.settings.lastOpened = td;
  if (RETURN_GAP >= 3 && !S.returns.some((r) => r.date === td)) S.returns.push({ date: td, missed: RETURN_GAP - 1 });
  lastDay = td;
  ONB.step = S.settings.onbStep || 1;
  if (!S.settings.welcomeDone && S.settings.envOpened) WEL = { stage: 'letter' };
  applyLangAttr();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  applyTheme(); render();
  document.addEventListener('click', onClick);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('.sheet')) A.closeSheet(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { flush(); if (AUTH && AUTH.hash && AUTH.lockOnHide && !LOCKED) lockNow(); } else dayCheck(); });
  for (const ev of ['pointerdown', 'keydown', 'scroll']) document.addEventListener(ev, () => { lastActivity = Date.now(); }, { passive: true, capture: true });
  document.addEventListener('keydown', (e) => { if (LOCKED && e.key === 'Enter' && e.target && e.target.id === 'lkPin') A.lockTry(); });
  setInterval(autoLockTick, 15000);
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyLook(LOOK_DRAFT || undefined)); } catch (e) { } }
  window.addEventListener('pagehide', () => flush());
  setInterval(dayCheck, 30000);
  save();
  if ('serviceWorker' in navigator && !inFrame && location.protocol === 'https:') { navigator.serviceWorker.register('sw.js').catch(() => { }); }
}
/* Re-render when the calendar day changes in the user's timezone (e.g. at midnight) */

  if (td !== lastDay) { lastDay = td; if (S.settings.onboarded) S.settings.lastOpened = td; save(); if (!$('.sheet') && !LOCKED) render(); }
}

function goalCurrent(g, asOf) {

  if (tg.source === 'revenue') return S.business.results.filter((r) => r.type === 'Revenue' && r.amount != null && r.date >= g.startedOn && r.date <= end).reduce((s, r) => s + r.amount, 0);

const OC = () => ONBC[lang()] || ONBC.en;
const SC = () => SETUP[lang()] || SETUP.en;

/* A discreet language switch, kept on every onboarding screen after the first */
function langSwitch(id, cur) {
  return `<label class="lang-switch"><span class="sr-only">${esc(LANG_WORD[cur] || LANG_WORD.en)}</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    <select id="${id}" aria-label="${esc(LANG_WORD[cur] || LANG_WORD.en)}">${APP_LANGS.map(([k, n]) => `<option value="${k}" lang="${k}" ${k === cur ? 'selected' : ''}>${n}</option>`).join('')}</select></label>`;
}
function onbTop() { return `<div class="onb-top">${langSwitch('onbLang', lang())}</div>`; }
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.id === 'onbLang') A.onbLangChange(el.value);
  if (el.id === 'letterSheetLang') { SH.letterLang = el.value; refreshSheet(); }
  if (el.id === 'stLang' && SETUP[el.value]) { const nm = val('stName'); S.settings.language = el.value; S.settings.languageChosen = true; applyLangAttr(); save(); render(); const i = $('#stName'); if (i) i.value = nm; const sw = $('#stLang'); if (sw) sw.focus(); }
});
/* Changing language mid-onboarding keeps every answer and the current step */
A.onbLangChange = (l) => {
  if (!SETUP[l]) return;
  if (S.settings.welcomeDone) { if (ONB.step <= 1) setupCapture(); else obCapture(); }
  const q = val('suTzQ');
  S.settings.language = l; S.settings.languageChosen = true; S.settings.letterLang = l; applyLangAttr(); save(); render();
  const qi = $('#suTzQ'); if (qi && q) { qi.value = q; qi.dispatchEvent(new Event('input')); }
  const sw = $('#onbLang'); if (sw) sw.focus();
};
function applyLangAttr() { document.documentElement.lang = lang(); }

/* ----- Screen 0: language, before anything else (nothing preselected) ----- */
function renderLangPick() {
  return `<main class="wrap welcome" aria-labelledby="pickQ"><div class="lang-pick stack">
    <div class="brand-mark">One Day</div>
    <h1 id="pickQ" class="pick-q">${PICK_Q.map(([k, q]) => `<span lang="${k}">${esc(q)}</span>`).join('')}</h1>
    <div class="pick-list" role="group" aria-labelledby="pickQ">${APP_LANGS.map(([k, n]) => `<button class="btn pick-btn" data-act="langPick" data-l="${k}" lang="${k}">${n}</button>`).join('')}</div></div></main>`;
}
A.langPick = (el) => {
  const l = el.dataset.l; if (!SETUP[l]) return;
  const s = S.settings; s.language = l; s.languageChosen = true; s.letterLang = l; applyLangAttr(); save();
  WEL.stage = 'closed'; render(); const e = $('button.envelope'); if (e) e.focus();
};

/* ----- Screen 1: the envelope, in the chosen language ----- */
function renderEnvelope(opening) {
  const E = ENV[lang()] || ENV.en;
  return `<div class="env-wrap ${opening ? 'opening' : ''}">
    <button class="envelope" data-act="welOpen" aria-label="${esc(E.text + ' ' + E.hint + '.')}" aria-expanded="${opening ? 'true' : 'false'}">
      <span class="env-letter" aria-hidden="true"></span>
      <span class="env-body" aria-hidden="true"></span>
      <span class="env-flap" aria-hidden="true"></span>
      <span class="env-text" aria-hidden="true"><span class="env-en">${esc(E.text)}</span></span>
      <span class="env-seal" aria-hidden="true">${SEAL}</span>
    </button>
    ${opening ? '' : `<p class="env-hint" aria-hidden="true">${esc(E.hint)}</p>`}</div>`;
}
function renderWelcome() {
  if (!S.settings.languageChosen) return renderLangPick();
  if (WEL.stage === 'letter') return renderLetterPage(lang());
  return `<main class="wrap welcome" lang="${lang()}">${WEL.stage === 'opening' ? '' : onbTop()}${renderEnvelope(WEL.stage === 'opening')}</main>`;
}
A.welOpen = () => {
  if (WEL.stage !== 'closed') return;
  S.settings.envOpened = true; save();
  if (reducedMotion()) { WEL.stage = 'letter'; render(); window.scrollTo(0, 0); focusLetter(); return; }
  WEL.stage = 'opening'; render();
  setTimeout(() => { if (WEL.stage !== 'opening') return; WEL.stage = 'letter'; WEL.unfold = true; render(); window.scrollTo(0, 0); focusLetter(); }, 1500);
};
function focusLetter() { const p = $('.letter-page'); if (p) p.focus({ preventScroll: true }); }

/* ----- The letter itself (also reachable from Settings) ----- */
function letterHtml(l, fromSettings) {
  const L = LETTER[l] || LETTER.en;
  return `<article class="letter-page ${WEL.unfold && !fromSettings ? 'unfold' : ''}" tabindex="-1" lang="${l}" aria-label="${esc(L.title)}">
    <div class="letter-top">${langSwitch(fromSettings ? 'letterSheetLang' : 'onbLang', l)}</div>
    ${L.paras.map((p) => `<p>${esc(p)}</p>`).join('')}
    <p class="letter-closing">${esc(L.closing)}</p>
    <p class="letter-sign">Mariana</p>
    <p class="letter-role">${esc(L.role)}</p>
    ${fromSettings ? '' : `<div class="letter-invite"><p>${esc(L.ready)}</p><button class="btn primary" data-act="welBegin">${esc(L.go)}</button></div>`}
  </article>`;
}
function renderLetterPage(l) { const h = `<main class="wrap welcome letter-wrap">${letterHtml(l, false)}</main>`; WEL.unfold = false; return h; }
A.welBegin = () => {
  S.settings.welcomeDone = true; S.settings.onbStep = 1; ONB.step = 1; save(); render(); window.scrollTo(0, 0);
  const n = $('#suName'); if (n) n.focus();
};
A.openLetter = () => {
  SH.letterLang = lang();
  openSheet(() => `${sheetHead(esc((LETTER[SH.letterLang] || LETTER.en).title))}<div class="letter-sheet">${letterHtml(SH.letterLang, true)}</div>`, { full: true });
};

/* ----- Screen 2: name and timezone (language was chosen first) ----- */
function renderProfileSetup() {
  const s = S.settings;
  if (!SETUP_DRAFT) SETUP_DRAFT = { name: s.name || '', tz: s.timezone || 'America/Puerto_Rico', err: false };
  const D = SETUP_DRAFT; const L = SC();
  return `<main class="wrap" lang="${lang()}">${onbTop()}<div class="onb stack setup">
    <h1 class="brand">${esc(L.title)}</h1>
    <label class="f" for="suName">${esc(L.name)}
      <input class="inp ${D.err ? 'invalid' : ''}" id="suName" maxlength="60" autocomplete="given-name" placeholder="${esc(L.namePh)}" value="${esc(D.name)}" aria-required="true" aria-invalid="${D.err}" aria-describedby="suNameErr"></label>
    <div id="suNameErr" class="field-err" role="alert">${D.err ? esc(L.nameErr) : ''}</div>
    <div class="f"><span id="suTzLab">${esc(L.tz)}</span>${tzPicker('suTz', D.tz, L)}<span class="hint">${esc(L.tzLater)}</span></div>
    <button class="btn primary" data-act="setupSave">${esc(L.cont)}</button>
    <button class="btn ghost sm" data-act="enterDemo">${esc(L.demo)}</button>
    <p class="tiny muted">${esc(L.local)}</p></div></main>`;
}
function setupCapture() { const n = $('#suName'); if (n && SETUP_DRAFT) SETUP_DRAFT.name = n.value; }
function bindSetup() {
  applyLangAttr();
  if (!$('#suName')) return;
  $('#suName').addEventListener('input', (e) => { SETUP_DRAFT.name = e.target.value; if (SETUP_DRAFT.err && e.target.value.trim()) { SETUP_DRAFT.err = false; e.target.classList.remove('invalid'); e.target.setAttribute('aria-invalid', 'false'); $('#suNameErr').textContent = ''; } });
  bindTzPicker('suTz', () => SETUP_DRAFT.tz, SC());
}
A.setupSave = () => {
  setupCapture(); const D = SETUP_DRAFT;
  const name = D.name.replace(/\s+/g, ' ').trim();
  if (!name) { D.err = true; render(); const n = $('#suName'); if (n) n.focus(); return; }
  if (!validTz(D.tz)) D.tz = 'America/Puerto_Rico';
  const s = S.settings; s.name = name; s.timezone = D.tz;
  SETUP_DRAFT = null; ONB.step = 2; s.onbStep = 2; save(); render(); window.scrollTo(0, 0);
};

 nel silenzio.","Les jours de repos comptent. Les racines poussent dans le calme."],"One action today is enough to grow.":["Una acción hoy basta para crecer.","Un’azione oggi basta per crescere.","Une action aujourd’hui suffit pour grandir."],"Nothing here needs to be perfect to grow.":["Nada aquí tiene que ser perfecto para crecer.","Niente qui deve essere perfetto per crescere.","Rien ici n’a besoin d’être parfait pour grandir."],"A five-minute version is still water and light.":["Una versión de cinco minutos sigue siendo agua y luz.","Una versione da cinque minuti è comunque acqua e luce.","Une version de cinq minutes, c’est encore de l’eau et de la lumière."],"What you logged this week is already part of the plant.":["Lo que registraste esta semana ya es parte de la planta.","Ciò che hai registrato questa settimana fa già parte della pianta.","Ce que tu as noté cette semaine fait déjà partie de la plante."],"Steady beats big. The trunk thickens slowly.":["Lo constante le gana a lo grande. El tronco engrosa despacio.","La costanza batte la grandezza. Il tronco si ispessisce piano.","La régularité bat l’ampleur. Le tronc s’épaissit lentement."],"Coming back is part of growing.":["Volver es parte de crecer.","Tornare fa parte del crescere.","Revenir fait partie de grandir."],"The plan bends; the plant keeps every ring.":["El plan se dobla; la planta conserva cada anillo.","Il piano si piega; la pianta conserva ogni anello.","Le plan plie ; la plante garde chaque cerne."],"Growth from today stays, whatever tomorrow looks like.":["Lo que crece desde hoy se queda, sea como sea mañana.","La crescita di oggi resta, comunque vada domani.","Ce qui pousse aujourd’hui reste, quoi qu’il arrive demain."],"You only need to begin the next small thing.":["Solo necesitas empezar lo siguiente, algo pequeño.","Ti basta iniziare la prossima piccola cosa.","Il te suffit de commencer la prochaine petite chose."],"Resting with you during the pause.":["Descansando contigo durante la pausa.","Riposa con te durante la pausa.","Se repose avec toi pendant la pause."],"Resting. It will be here when you are.":["Descansando. Estará aquí cuando tú estés.","Riposa. Sarà qui quando tornerai.","Au repos. Il sera là quand tu reviendras."],"Your garden is ready when you are. Continue growing, or begin a new chapter?":["Tu jardín está listo cuando tú lo estés. ¿Seguir creciendo o empezar un nuevo capítulo?","Il tuo giardino è pronto quando lo sei tu. Continuare a crescere o iniziare un nuovo capitolo?","Ton jardin est prêt quand tu l’es. Continuer à grandir ou commencer un nouveau chapitre ?"],"Continue growing":["Seguir creciendo","Continua a crescere","Continuer à grandir"],"Begin a new chapter":["Empezar un nuevo capítulo","Inizia un nuovo capitolo","Commencer un nouveau chapitre"],"Everything grown so far is kept":["Todo lo que ha crecido se conserva","Tutto ciò che è cresciuto viene conservato","Tout ce qui a poussé est gardé"],"A new season for the same plant":["Una nueva temporada para la misma planta","Una nuova stagione per la stessa pianta","Une nouvelle saison pour la même plante"],"A new plot beside it":["Una nueva parcela al lado","Un nuovo appezzamento accanto","Une nouvelle parcelle à côté"],"e.g. Winter chapter":["p. ej., capítulo de invierno","es. capitolo d’inverno","ex. chapitre d’hiver"],"Kind":["Tipo","Tipo","Type"],"Begin":["Empezar","Inizia","Commencer"],"A new season begins. Everything grown is still here.":["Empieza una nueva temporada. Todo lo que creció sigue aquí.","Inizia una nuova stagione. Tutto ciò che è cresciuto è ancora qui.","Une nouvelle saison commence. Tout ce qui a poussé est toujours là."],"A new plot. The first one is kept in your history.":["Una parcela nueva. La primera se conserva en tu historial.","Un nuovo appezzamento. Il primo resta nella tua cronologia.","Une nouvelle parcelle. La première est gardée dans ton historique."],"Daily records":["Registros diarios","Registrazioni quotidiane","Saisies quotidiennes"],"Business result":["Resultado del negocio","Risultato dell’attività","Résultat de l’entreprise"],"Goal completed":["Meta completada","Obiettivo completato","Objectif atteint"],"{0} growth so far. The next stage comes at {1}.":["{0} de crecimiento hasta ahora. La próxima etapa llega a {1}.","{0} di crescita finora. La prossima fase arriva a {1}.","{0} de croissance jusqu’ici. La prochaine étape arrive à {1}."],"{0} growth. Fully grown, and it keeps every ring.":["{0} de crecimiento. Ya creció por completo, y conserva cada anillo.","{0} di crescita. Completamente cresciuto, e conserva ogni anello.","{0} de croissance. Entièrement grandi, et il garde chaque cerne."],"Earlier chapters":["Capítulos anteriores","Capitoli precedenti","Chapitres précédents"],"Completed actions give 2, smaller versions and rest days 1, a check-in 1, up to {0} a day. Milestones, business results and finished goals add more. Growth is never taken away; quiet days only let it rest, and paused days don’t count.":["Las acciones completadas dan 2; las versiones pequeñas y los días de descanso, 1; una revisión, 1; hasta {0} por día. Los hitos, resultados del negocio y metas terminadas suman más. El crecimiento nunca se quita; los días tranquilos solo lo dejan descansar, y los días en pausa no cuentan.","Le azioni completate valgono 2, le versioni piccole e i giorni di riposo 1, un check-in 1, fino a {0} al giorno. Traguardi, risultati dell’attività e obiettivi completati aggiungono di più. La crescita non viene mai tolta; i giorni tranquilli la lasciano solo riposare, e i giorni in pausa non contano.","Une action terminée rapporte 2, les petites versions et les jours de repos 1, un bilan 1, jusqu’à {0} par jour. Les étapes, résultats d’entreprise et objectifs atteints ajoutent davantage. La croissance n’est jamais retirée ; les jours calmes la laissent seulement se reposer, et les jours en pause ne comptent pas."],"Show the companion on Today":["Mostrar el compañero en Hoy","Mostra il compagno in Oggi","Afficher le compagnon dans Aujourd’hui"],"Show a daily message":["Mostrar un mensaje diario","Mostra un messaggio quotidiano","Afficher un message quotidien"],"Gentle movement":["Movimiento suave","Movimento delicato","Mouvement doux"],"A small living companion on Today that grows from what you record. It never dies or shames; quiet days only let it rest.":["Un pequeño compañero vivo en Hoy que crece con lo que registras. Nunca muere ni avergüenza; los días tranquilos solo lo dejan descansar.","Un piccolo compagno vivo in Oggi che cresce con ciò che registri. Non muore mai e non giudica; i giorni tranquilli lo lasciano solo riposare.","Un petit compagnon vivant dans Aujourd’hui qui grandit avec ce que tu notes. Il ne meurt jamais et ne culpabilise pas ; les jours calmes le laissent seulement se reposer."],"Kind for this chapter":["Tipo para este capítulo","Tipo per questo capitolo","Type pour ce chapitre"],"Save companion":["Guardar compañero","Salva il compagno","Enregistrer le compagnon"],"Everything":["Todo","Tutto","Tout"],"Welcome back. Resume your plan or adjust your first day?":["Qué bueno verte. ¿Retomas tu plan o ajustas tu primer día?","Che bello rivederti. Riprendi il piano o modifichi il primo giorno?","Bon retour. Reprendre ton plan ou ajuster ton premier jour ?"],"Your pause ended {0}. Nothing from the paused days is owed, and everything you recorded is still here. The plan stays paused until you choose.":["Tu pausa terminó el {0}. No se debe nada de los días en pausa, y todo lo que registraste sigue aquí. El plan sigue en pausa hasta que elijas.","La pausa è finita il {0}. Nulla è dovuto per i giorni di pausa, e tutto ciò che hai registrato è ancora qui. Il piano resta in pausa finché non scegli.","Ta pause s’est terminée le {0}. Rien n’est dû pour les jours en pause, et tout ce que tu as noté est toujours là. Le plan reste en pause tant que tu n’as pas choisi."],"Resume my plan":["Retomar mi plan","Riprendi il mio piano","Reprendre mon plan"],"Adjust my first day":["Ajustar mi primer día","Modifica il primo giorno","Ajuster mon premier jour"],"Extend the pause":["Extender la pausa","Prolunga la pausa","Prolonger la pause"],"Nothing is scheduled and nothing is owed. Your companion rests too.":["No hay nada programado ni pendiente. Tu compañero también descansa.","Niente in programma e niente in sospeso. Anche il tuo compagno riposa.","Rien n’est prévu ni dû. Ton compagnon se repose aussi."],"Paused areas have nothing scheduled. Everything else continues.":["Las áreas en pausa no tienen nada programado. Todo lo demás sigue.","Le aree in pausa non hanno nulla in programma. Tutto il resto continua.","Les domaines en pause n’ont rien de prévu. Tout le reste continue."],"{0} You can still log anything you feel like.":["{0} Igual puedes registrar lo que quieras.","{0} Puoi comunque registrare ciò che vuoi.","{0} Tu peux quand même noter ce que tu veux."],"Extend or change":["Extender o cambiar","Prolunga o modifica","Prolonger ou modifier"],"End now":["Terminar ahora","Termina ora","Terminer maintenant"],"Pause scheduled: {0}, {1} to {2}.":["Pausa programada: {0}, del {1} al {2}.","Pausa programmata: {0}, dal {1} al {2}.","Pause prévue : {0}, du {1} au {2}."],"Change":["Cambiar","Modifica","Modifier"],"Scheduled":["Programada","Programmata","Prévue"],"Cancel pause":["Cancelar pausa","Annulla la pausa","Annuler la pause"],"End early":["Terminar antes","Termina prima","Terminer plus tôt"],"Plan a pause":["Planificar una pausa","Pianifica una pausa","Planifier une pause"],"Pause the whole routine or selected areas for a trip, illness or a break. Paused days have no reminders, build no backlog and aren’t counted in your progress. Records are kept.":["Pausa toda la rutina o algunas áreas por un viaje, una enfermedad o un descanso. Los días en pausa no tienen recordatorios, no acumulan pendientes y no cuentan en tu progreso. Los registros se conservan.","Metti in pausa tutta la routine o alcune aree per un viaggio, una malattia o una pausa. I giorni in pausa non hanno promemoria, non accumulano arretrati e non contano nei progressi. Le registrazioni restano.","Mets en pause toute la routine ou certains domaines pour un voyage, une maladie ou une pause. Les jours en pause n’ont pas de rappels, ne créent pas de retard et ne comptent pas dans tes progrès. Les saisies sont gardées."],"Reminder when a pause ends":["Recordatorio al terminar una pausa","Promemoria alla fine di una pausa","Rappel à la fin d’une pause"],"An email or text at the end of a pause isn’t available in this version. Sending one needs a server and a verified email address or phone number, and this app has neither, so no reminder is set or pretended. When you open the app after the pause, it asks before anything resumes.":["Un correo o mensaje de texto al terminar una pausa no está disponible en esta versión. Enviarlo necesita un servidor y un correo o teléfono verificado, y esta app no tiene ninguno, así que no se configura ni se simula ningún recordatorio. Cuando abras la app después de la pausa, te pregunta antes de retomar nada.","Un’email o un SMS alla fine di una pausa non è disponibile in questa versione. Inviarlo richiede un server e un indirizzo email o numero di telefono verificato, e questa app non ha né l’uno né l’altro, quindi nessun promemoria viene impostato o simulato. Quando apri l’app dopo la pausa, ti chiede prima di riprendere qualsiasi cosa.","Un e-mail ou un SMS à la fin d’une pause n’est pas disponible dans cette version. Il faudrait un serveur et une adresse e-mail ou un numéro vérifié, et cette app n’a ni l’un ni l’autre, donc aucun rappel n’est configuré ni simulé. Quand tu rouvres l’app après la pause, elle te demande avant de reprendre quoi que ce soit."],"Change pause":["Cambiar pausa","Modifica la pausa","Modifier la pause"],"Selected areas":["Áreas seleccionadas","Aree selezionate","Domaines choisis"],"Start pause":["Empezar pausa","Inizia la pausa","Commencer la pause"],"What to pause s restent à part, intactes."],"One Day keeps a daily loop: a specific next action, a quick log, a two-minute evening check-in and a short weekly review. Feedback is rule-based and shown openly. It isn’t therapy, financial advice or athletic coaching.":["One Day mantiene un ciclo diario: una próxima acción concreta, un registro rápido, una revisión de dos minutos en la noche y una breve revisión semanal. Las sugerencias se basan en reglas y se muestran abiertamente. No es terapia, ni asesoría financiera, ni entrenamiento deportivo.","One Day segue un ciclo quotidiano: una prossima azione precisa, una registrazione veloce, un check-in serale di due minuti e una breve revisione settimanale. I suggerimenti seguono regole e sono mostrati apertamente. Non è terapia, consulenza finanziaria o coaching sportivo.","One Day suit une boucle quotidienne : une prochaine action précise, une saisie rapide, un bilan du soir de deux minutes et un court bilan de la semaine. Les retours suivent des règles et sont affichés ouvertement. Ce n’est ni une thérapie, ni du conseil financier, ni du coaching sportif."],"Reset demo data":["Restablecer datos de demo","Reimposta i dati demo","Réinitialiser les données de démo"],"Erase everything on this device":["Borrar todo en este dispositivo","Cancella tutto su questo dispositivo","Tout effacer sur cet appareil"],"Deletes every record, goal, pause, companion growth, your PIN and your background photo from this device. It can’t be undone. Export a backup first if you might want it.":["Borra todos los registros, metas, pausas, el crecimiento del compañero, tu PIN y tu foto de fondo de este dispositivo. No se puede deshacer. Exporta una copia primero si podrías quererla.","Elimina da questo dispositivo ogni voce, obiettivo, pausa, la crescita del compagno, il PIN e la foto di sfondo. Non si può annullare. Esporta prima un backup se potrebbe servirti.","Supprime de cet appareil chaque saisie, objectif, pause, la croissance du compagnon, ton code et const RCL = () => RC[lang()] || RC.en;
const rcf = (s, ...a) => s.replace(/\{(\d)\}/g, (m, i) => a[i]);

/* The pause that puts the whole app to rest: everything paused, started, not yet resumed */
function restPause() { const p = currentPause(); return p && p.scope === 'all' ? p : null; }

/* One quotation per local calendar day (saved timezone). Approved entries cycle in a fixed
   order, so nothing repeats until all have been shown, and a language change keeps the same one. */
function restQuote(ds) {
  const list = REST_QUOTES.filter((q) => q.status === 'approved' && q.verification && q.verification.status === 'verified').sort((a, b) => (a.id < b.id ? -1 : 1));
  if (!list.length) return null;
  const day = Math.floor(dParse(ds || today()).getTime() / 86400000);
  return list[((day % list.length) + list.length) % list.length];
}
function renderRestQuote(q) {
  if (!q) return '';
  const L = lang(); const R = RCL();
  const text = q.text[L] || q.text.en; const shownLang = q.text[L] ? L : 'en';
  const tr = (q.translations || {})[shownLang];
  const author = (q.authorL && (q.authorL[L] || q.authorL.en)) || q.author;
  let label = '';
  if (tr && tr.type === 'published') label = `<span>${esc(rcf(R.published, tr.name))}</span>`;
  else if (shownLang !== q.lang) label = `<span>${esc((R.from[q.lang] || RC.en.from[q.lang] || '') + ' · ' + R.byApp)}</span>`;
  const orig = shownLang !== q.lang && (tr ? tr.type === 'app' : true)
    ? `<details class="rq-orig"><summary>${esc(R.original)}</summary><p lang="${esc(q.lang)}">${esc(q.original || q.text[q.lang] || '').replace(/\n/g, '<br>')}</p></details>` : '';
  const link = (tr && tr.type === 'published' && tr.url) || q.source.url;
  return `<figure class="rest-quote card" id="restQuote" data-q="${esc(q.id)}">
    <blockquote lang="${esc(shownLang)}"><p>${L === 'en' ? '“' : L === 'fr' ? '«\u202f' : '«'}${esc(text).replace(/\n/g, '<br>')}${L === 'en' ? '”' : L === 'fr' ? '\u202f»' : '»'}</p></blockquote>
    <figcaption><div class="rq-author">— <span lang="${esc(q.lang === 'he' ? L : 'en')}">${esc(author)}</span></div>
      <div class="rq-meta tiny muted">${q.cite ? `<span lang="${esc(q.lang === 'la' ? 'la' : 'en')}">${esc(q.cite)}</span> · ` : ''}<a href="${esc(link)}" target="_blank" rel="noopener noreferrer">${esc(R.source)}</a></div>
      ${label ? `<div class="rq-label tiny muted">${label}</div>` : ''}${orig}</figcaption></figure>`;
}

/* The caretaker: a small figure drawn over the environment. Movement is SVG animation,
   left out entirely when motion is reduced or the companion's gentle movement is off. */

    <path d="M-7 -10 Q -8 -24 0 -25 Q 8 -24 7 -10 Z" fill="var(--ct-cloth)"/><circle cx="0" cy="-29.5" r="4.8" fill="var(--ct-skin)"/>
    <ellipse cx="0" cy="-33" rx="8.5" ry="2" fill="var(--ct-hat)"/><path d="M-4.6 -33 Q 0 -40 4.6 -33 Z" fill="var(--ct-hat)"/>${armTool}`;
  let fig;
  if (kind === 'bonsai') {
    const steam = moving ? '<animate attributeName="opacity" values="0;.8;0" dur="5s" repeatCount="indefinite"/>' : '';
    fig = `<g transform="translate(13 101) scale(.62)">
      <rect x="-6" y="-5" width="16" height="5" rx="2.5" fill="var(--ct-pants)"/>
      <g>${moving ? '<animateTransform attributeName="transform" type="translate" values="0 0;0 -0.6;0 0" dur="6s" repeatCount="indefinite"/>' : ''}
        <path d="M-7 -4 Q -8 -19 0 -20 Q 8 -19 7 -4 Z" fill="var(--ct-cloth)"/><circle cx="0" cy="-24.5" r="4.8" fill="var(--ct-skin)"/>
        <ellipse cx="0" cy="-28" rx="8.5" ry="2" fill="var(--ct-hat)"/><path d="M-4.6 -28 Q 0 -35 4.6 -28 Z" fill="var(--ct-hat)"/>
        <path d="M4 -15 Q 9 -12 11 -9" stroke="var(--ct-skin)" stroke-width="2.4" fill="none" stroke-linecap="round"/></g>
      <rect x="10" y="-11" width="5" height="5" rx="1" fill="var(--ct-tool)"/>
      <path d="M12.5 -13 q -1.5 -2.5 0 -5 q 1.5 -2.5 0 -5" stroke="var(--muted)" stroke-width=".8" fill="none" opacity="${moving ? 0 : .6}">${steam}</path></g>`;
  } else if (kind === 'farm') {
    fig = `<g transform="translate(18 113) scale(.6)">${person(`<g>${anim('-4 4 -22;7 4 -22;-4 4 -22', '7s')}
      <path d="M4 -22 L 9 -14" stroke="var(--ct-skin)" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M6 -24 L 17 0" stroke="var(--g-trunk)" stroke-width="1.8" stroke-linecap="round"/><path d="M14.5 0.5 h 6" stroke="var(--ct-tool)" stroke-width="2.4" stroke-linecap="round"/></g>`)}</g>`;
  } else {
    const drop = (x, y, b) => `<circle cx="${x}" cy="${y}" r="1.1" fill="var(--ct-water)" opacity="${moving ? 0 : .8}">${moving ? `<animate attributeName="opacity" values="0;.9;0" dur="2.6s" begin="${b}s" repeatCount="indefinite"/>` : ''}</circle>`;
    fig = `<g transform="translate(16 113) scale(.6)">${person(`<g>${anim('-3 4 -22;9 4 -22;9 4 -22;-3 4 -22', '8s')}
      <path d="M4 -22 L 11 -16" stroke="var(--ct-skin)" stroke-width="2.4" stroke-linecap="round"/>
      <rect x="10" y="-20" width="9" height="7" rx="1.8" fill="var(--ct-tool)"/><path d="M19 -18 L 25 -22" stroke="var(--ct-tool)" stroke-width="1.6" stroke-linecap="round"/>

  }
  return `<svg class="caretaker" viewBox="0 0 120 120" preserveAspectRatio="xMidYMax slice" aria-hidden="true">${fig}</svg>`;
}

function renderRest() {
  const p = restPause(); const R = RCL(); const L = lang();
  const c = companionState(); const kind = c.ch.kind;
  const moving = S.growth.animations !== false && !reducedMotion();
  const ended = pauseState(p) === 'ended';
  let note = '';
  if (ended && p.returnNote && !p.returnNoteCancelled) {
    if (!p.returnNoteShownOn) { p.returnNoteShownOn = today(); save(); }
    if (p.returnNoteShownOn === today()) note = `<p class="rest-note small" role="status">${esc(R.arrived)}</p>`;
  }
  const endDate = dFmt(p.end.slice(0, 10), { weekday: 'long', month: 'long', day: 'numeric' });
  const stageName = trText(STAGE_NAMES[kind][c.stage]);
  return `<main class="wrap rest" id="main" data-raw lang="${L}">
    <header class="rest-top"><span class="eyebrow">${esc(R.eyebrow)}</span>
      <button class="btn ghost sm" data-act="restMenu" aria-haspopup="dialog">${esc(R.menu)}</button></header>
    ${renderRestQuote(restQuote(today()))}
    <figure class="rest-scene ${moving ? 'anim' : ''}" role="img" aria-label="${esc(rcf(R.scene, R.kinds[kind], stageName, R.acts[kind]))}">
      ${drawCompanion(kind, c.stage, c.ch.seed, false).replace('<svg ', '<svg preserveAspectRatio="xMidYMax slice" ')}${drawCaretaker(kind, moving)}</figure>
    ${note}
    <div class="rest-foot"><p class="tiny muted">${esc(rcf(R.planned, endDate))}. ${esc(R.calm)}</p>
      <button class="btn rest-return" data-act="restReturn">${esc(R.ready)}</button></div></main>`;
}

    return `${sheetHead(esc(R.menuTitle), esc(R.menuSub))}<div class="stack" data-raw>
      <div class="row-between"><span>${esc(R.lang)}</span>${langSwitch('restLang', lang())}</div>
      <button class="btn rest-item" data-act="restLook"><b>${esc(R.look)}</b><span class="tiny muted">${esc(R.lookSub)}</span></button>
      <button class="btn rest-item" data-act="pauseForm" data-id="${p.id}"><b>${esc(R.dates)}</b><span class="tiny muted">${esc(R.datesSub)}</span></button>
      <label class="rest-check"><input type="checkbox" id="restNote" data-act="restNote" ${p.returnNote ? 'checked' : ''} ><span><b class="small">${esc(R.note)}</b><br><span class="tiny muted">${esc(R.noteSub)}</span></span></label>
      <button class="btn rest-item" data-act="restPrivacy"><b>${esc(R.privacy)}</b><span class="tiny muted">${esc(R.privacySub)}</span></button>
      ${AUTH && AUTH.hash ? `<button class="btn sm" data-act="lockNowBtn">${esc(R.lock)}</button>` : ''}
      <p class="tiny muted">${esc(R.account)}</p></div>`;
  });
};
A.restLook = () => { closeSheet(true); A.lookOpen(); };
A.restNote = (el) => { setTimeout(() => { const p = restPause(); if (!p) return; p.returnNote = el.checked; if (el.checked) delete p.returnNoteShownOn; save(); }, 0); };
A.restPrivacy = () => {
  closeSheet(true);
  openSheet(() => `${sheetHead(esc(RCL().privacy))}<div class="stack">
    <div class="small stack-s"><p>Your records stay on this device, in this browser. They don’t sync to other devices. There is no online account, no tracking, no analytics and no bank connection.</p>
      <p>The PIN lock keeps the app private from casual viewing. It doesn’t encrypt the stored records; anyone with full access to this phone’s browser data could still read them.</p></div>
    <div class="btn-row"><button class="btn primary sm" data-act="exportJson">Back up (JSON)</button></div>
    <div class="stack-s"><div class="h3">PIN lock</div>${renderSecurity()}</div>
    ${DEMO ? '' : `<div class="stack-s"><div class="h3">${t('set.delete')}</div><p class="small">Deletes every record, goal, pause, companion growth, your PIN and your background photo from this device. It can’t be undone. Export a backup first if you might want it.</p>
      <label class="f">Type DELETE to confirm<input class="inp" id="delConfirm" autocomplete="off" autocapitalize="characters"></label>
      <button class="btn ghost danger" data-act="eraseAll">Delete everything</button></div>`}</div>`);
};
document.addEventListener('change', (e) => {
  if (e.target.id !== 'restLang' || !SETUP[e.target.value]) return;
  S.settings.language = e.target.value; S.settings.languageChosen = true; applyLangAttr(); save(); refreshSheet(); render();
  const sw = $('#restLang'); if (sw) sw.focus();
});

/* Return: end the pause now, cancel the pending note, open Today. Nothing is owed. */
A.restReturn = () => {
  const p = restPause(); if (!p) { render(); return; }
  const now = localNow(p.tz);
  if (now < p.end) { p.end = now; p.endedEarly = true; if (p.returnNote && !p.returnNoteShownOn) p.returnNoteCancelled = true; }
  p.resumedOn = today(); p.resumedAt = nowISO();
  S.dismissed.restBack = today(); save();
  TAB = 'today'; render(); window.scrollTo(0, 0);
  const b = $('#restBack'); if (b) { b.setAttribute('tabindex', '-1'); b.focus({ preventScroll: true }); }
};
function renderRestBack(td) {
  if (S.dismissed.restBack !== td) return '';
  const R = RCL();
  return `<section class="banner pink stack-s" id="restBack" data-raw><div class="row-between"><div class="h3">${esc(R.back)}</div>
    <button class="btn ghost sm" data-act="restBackClose" aria-label="${esc(R.dismiss)}">✕</button></div>
    <div><button class="btn sm" data-act="restAdjust">${esc(R.adjust)}</button></div></section>`;
}
A.restBackClose = () => { S.dismissed.restBack = null; save(); render(); };
A.restAdjust = () => { S.dismissed.restBack = null; save(); render(); A.makeSmaller(); };

/* Bookmarkable views: #today, #plan, #progress, #mindset, #settings.
   While resting, every address shows Rest Mode and reads #rest. */
const VIEWS = ['today', 'plan', 'progress', 'mindset', 'settings'];
(function () { const h = location.hash.slice(1); if (VIEWS.includes(h)) TAB = h; })();
function syncHash(rest) {
  const want = '#' + (rest ? 'rest' : TAB);
  if (location.hash !== want) { try { history.replaceState(null, '', want); } catch (e) { } }
}
window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  if (VIEWS.includes(h) && !restPause()) { TAB = h; closeSheet(true); render(); }
  else render();
});
let restWas = null;
/* Pauses start and end at a set time: switch views when that moment passes */
function restCheck() { const r = !!(S && S.settings.onboarded && restPause()); if (restWas !== null && r !== restWas && !$('.sheet') && !LOCKED) render(); restWas = r; }
setInterval(restCheck, 30000);

boot();

</script>
</body>
</html>
